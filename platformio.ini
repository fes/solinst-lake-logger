[platformio]
default_envs = opta

[firmware]
platform = ststm32
framework = arduino
build_flags =
  -I.
  -I${platformio.packages_dir}/framework-arduino-mbed/libraries/SocketWrapper/src
lib_deps =
  arduino-libraries/ArduinoHttpClient
  arduino-libraries/NTPClient
  adafruit/Adafruit INA228 Library

[env:opta]
platform = ${firmware.platform}
board = opta
framework = ${firmware.framework}
build_flags =
  ${firmware.build_flags}
  -DLOGGER_BOARD_OPTA
lib_deps =
  ${firmware.lib_deps}
  arduino-libraries/ArduinoRS485
  olikraus/U8g2

[env:opta-placeholder]
extends = env:opta
build_flags =
  ${env:opta.build_flags}
  -DALLOW_PLACEHOLDER_SECRETS

[env:opta-commissioning]
extends = env:opta
build_flags =
  ${env:opta.build_flags}
  -DLOGGER_COMMISSIONING_UPLOAD_ON_BOOT

[env:opta-debug]
extends = env:opta
build_flags =
  ${env:opta.build_flags}
  -DLOGGER_WAIT_FOR_SERIAL_ON_BOOT

[env:giga]
platform = ${firmware.platform}
board = giga_r1_m7
framework = ${firmware.framework}
build_flags =
  ${firmware.build_flags}
  -DLOGGER_BOARD_GIGA
lib_deps =
  ${firmware.lib_deps}
  zinggjm/GxEPD2 @ 1.6.9

[env:giga-placeholder]
extends = env:giga
build_flags =
  ${env:giga.build_flags}
  -DALLOW_PLACEHOLDER_SECRETS

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
lib_compat_mode = off

[env:native-giga]
extends = env:native
build_flags =
  -DLOGGER_BOARD_GIGA
